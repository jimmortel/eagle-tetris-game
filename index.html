<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Tetris 🦅📱</title>

    <meta property="fc:frame" content='{"version":"next","imageUrl":"https://eagle-tetris-game.vercel.app/splash.png","buttonName":"Jouer au Tetris 🦅"}' />
    <meta property="og:title" content="Eagle Tetris 🦅" />
    <meta property="og:description" content="Joue au Tetris et gagne ta place au Hall of Fame en $TALON !" />
    <meta property="og:image" content="https://eagle-tetris-game.vercel.app/splash.png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="access.js"></script>
    <style>
        body { background: #1a1a1a; color: gold; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: none; padding-top: 10px; }
        h1 { font-size: 1.1rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        #start-btn { background: red; color: white; font-weight: bold; padding: 12px 24px; border: 3px solid white; border-radius: 8px; margin-bottom: 5px; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        #game-layout { display: flex; gap: 10px; transform: scale(0.75); transform-origin: top center; }
        #game-container { position: relative; border: 4px solid gold; background: #000; }
        canvas { display: block; background-color: #000; }
        .stats { display: flex; flex-direction: column; font-weight: bold; font-size: 1.2rem; min-width: 80px; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: -30px; width: 90%; max-width: 300px; }
        .touch-btn { background: rgba(255, 215, 0, 0.1); border: 2px solid gold; border-radius: 10px; padding: 15px; font-size: 20px; color: gold; text-align: center; }
        .touch-btn:active { background: gold; color: black; }
        #btn-rotate { grid-column: 2; } #btn-left { grid-column: 1; } #btn-down { grid-column: 2; } #btn-right { grid-column: 3; }
        #tips-btn { background: rgba(133, 93, 205, 0.2); border: 1px solid #855dcd; border-radius: 8px; padding: 8px 15px; color: #dcbfff; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>EAGLE TETRIS 🦅📱</h1>
    <button id="start-btn">START (10 $TALON) 🦅</button>
    <div id="game-layout">
        <div id="game-container"><canvas id="tetris" width="240" height="400"></canvas></div>
        <div class="stats">
            <div>Score:<br><span id="score">0</span></div><br>
            <div>Record:<br><span id="high-score">0</span></div><br>
            <div>Lines:<br><span id="lines">0</span></div>
        </div>
    </div>
    <div class="controls">
        <div id="btn-rotate" class="touch-btn">↻</div>
        <div id="btn-left" class="touch-btn">←</div>
        <div id="btn-down" class="touch-btn">↓</div>
        <div id="btn-right" class="touch-btn">→</div>
        <div style="grid-column: 1 / span 3; margin-top: 15px; display: flex; justify-content: center;">
            <a href="https://warpcast.com/eagle-pi" target="_blank" id="tips-btn">🟣 Tip on Farcaster</a>
        </div>
    </div>
    <script>
    const SUPABASE_URL = "https://rjkyjqmydriagpiatbsr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqa3lqcW15ZHJpYWdwaWF0YnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMzQ5MTEsImV4cCI6MjA4OTYxMDkxMX0.4-uEBo_SFqfMgPpTuDQRxTYLeUoI_ZMZlwtkBJzK_X0";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    let gameRunning = false, lastTime = 0, dropCounter = 0, dropInterval = 1000;
    const arena = createArena(12, 20), player = { pos: {x: 0, y: 0}, matrix: null, score: 0, lines: 0 };
    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

    async function handleEagleStart() {
        const canPlay = await checkGameAccess('tetris');
        if (canPlay) startGame();
    }

    function startGame() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('start-btn').style.display = 'none';
        if (!gameRunning) { gameRunning = true; playerReset(); updateScore(); update(); }
    }

    function createPiece(t) {
        if (t === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
        if (t === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
        if (t === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
        if (t === 'O') return [[4, 4], [4, 4]];
        if (t === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
        if (t === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        if (t === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
    }

    function createArena(w, h) { const m = []; while (h--) m.push(new Array(w).fill(0)); return m; }
    function draw() { context.fillStyle = '#000'; context.fillRect(0, 0, canvas.width, canvas.height); drawMatrix(arena, {x: 0, y: 0}); drawMatrix(player.matrix, player.pos); }
    function drawMatrix(m, o) { m.forEach((row, y) => { row.forEach((v, x) => { if (v !== 0) { context.fillStyle = colors[v]; context.fillRect(x + o.x, y + o.y, 1, 1); } }); }); }
    function collide(a, p) { const [m, o] = [p.matrix, p.pos]; for (let y = 0; y < m.length; ++y) { for (let x = 0; x < m[y].length; ++x) { if (m[y][x] !== 0 && (a[y + o.y] && a[y + o.y][x + o.x]) !== 0) return true; } } return false; }
    function merge(a, p) { p.matrix.forEach((row, y) => { row.forEach((v, x) => { if (v !== 0) a[y + p.pos.y][x + p.pos.x] = v; }); }); }
    function playerDrop() { player.pos.y++; if (collide(arena, player)) { player.pos.y--; merge(arena, player); playerReset(); arenaSweep(); } dropCounter = 0; }
    function arenaSweep() { let rC = 1; outer: for (let y = arena.length - 1; y > 0; --y) { for (let x = 0; x < arena[y].length; ++x) { if (arena[y][x] === 0) continue outer; } const row = arena.splice(y, 1)[0].fill(0); arena.unshift(row); ++y; player.score += rC * 10; player.lines += 1; rC *= 2; } updateScore(); }
    
    function playerReset() {
        const p = 'ILJOTSZ'; player.matrix = createPiece(p[p.length * Math.random() | 0]); player.pos.y = 0; player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) handleGameOver();
    }

    async function handleGameOver() {
        gameRunning = false;
        if (confirm(`GAME OVER ! Score: ${player.score}\n\nREVIVE (Continuer) pour 5 $TALON ?`)) {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            if (await executeTalonPayment(signer, 5)) {
                arena.forEach((row, y) => { if(y < 8) row.fill(0) });
                gameRunning = true; playerReset(); update(); return;
            }
        }
        if (player.score > 0) saveScore(player.score); else location.reload();
    }

    async function saveScore(s) {
        const u = prompt("Score: " + s + "\nEntre ton pseudo :");
        if (u) { await supabaseClient.from('leaderboard').insert([{ username: u, score: s, game: 'tetris' }]); window.location.href = 'hall.html'; }
        else location.reload();
    }

    function update(t = 0) { if (!gameRunning) return; const dT = t - lastTime; lastTime = t; dropCounter += dT; if (dropCounter > dropInterval) playerDrop(); draw(); requestAnimationFrame(update); }
    function updateScore() { document.getElementById('score').innerText = player.score; document.getElementById('lines').innerText = player.lines; let hi = localStorage.getItem('eagleTetrisHiScore') || 0; if (player.score > hi) { localStorage.setItem('eagleTetrisHiScore', player.score); hi = player.score; } document.getElementById('high-score').innerText = hi; }
    function playerRotate(d) { const p = player.pos.x; let o = 1; rotate(player.matrix, d); while (collide(arena, player)) { player.pos.x += o; o = -(o + (o > 0 ? 1 : -1)); if (o > player.matrix[0].length) { rotate(player.matrix, -d); player.pos.x = p; return; } } }
    function rotate(m, d) { for (let y = 0; y < m.length; ++y) { for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]]; } if (d > 0) m.forEach(r => r.reverse()); else m.reverse(); }
    function playerMove(d) { player.pos.x += d; if (collide(arena, player)) player.pos.x -= d; }

    document.getElementById('start-btn').onclick = handleEagleStart;
    
    const cmds = {'btn-left':-1, 'btn-right':1, 'btn-down':'d', 'btn-rotate':'r'};
    Object.keys(cmds).forEach(id => {
        const el = document.getElementById(id);
        const action = (e) => { 
            e.preventDefault(); 
            if (!gameRunning) return; 
            if (cmds[id] === 'd') playerDrop(); 
            else if (cmds[id] === 'r') playerRotate(1); 
            else playerMove(cmds[id]); 
        };
        if ('ontouchstart' in window) {
            el.addEventListener('touchstart', action, { passive: false });
        } else {
            el.addEventListener('click', action);
        }
    });

    document.addEventListener('keydown', e => { if (!gameRunning) return; if (e.keyCode === 37) playerMove(-1); else if (e.keyCode === 39) playerMove(1); else if (e.keyCode === 40) playerDrop(); else if (e.keyCode === 38) playerRotate(1); });
    </script>
</body>
</html>

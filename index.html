<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Tetris 🦅📱</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="access.js"></script>
    <style>
        body { background: #1a1a1a; color: gold; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: none; padding-top: 10px; }
        h1 { font-size: 1.1rem; margin: 5px 0; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        #start-btn { background: red; color: white; font-weight: bold; padding: 12px 24px; border: 3px solid white; border-radius: 8px; margin-bottom: 5px; font-size: 16px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        #game-layout { display: flex; gap: 10px; transform: scale(0.75); transform-origin: top center; }
        #game-container { position: relative; border: 4px solid gold; background: #000; }
        canvas { display: block; background-color: #000; }
        .stats { display: flex; flex-direction: column; font-weight: bold; font-size: 1.2rem; min-width: 80px; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: -30px; width: 90%; max-width: 300px; }
        .touch-btn { background: rgba(255, 215, 0, 0.1); border: 2px solid gold; border-radius: 10px; padding: 15px; font-size: 20px; color: gold; text-align: center; }
        .touch-btn:active { background: gold; color: black; }
        #btn-rotate { grid-column: 2; } #btn-left { grid-column: 1; } #btn-down { grid-column: 2; } #btn-right { grid-column: 3; }
        #tips-btn { background: rgba(133, 93, 205, 0.2); border: 1px solid #855dcd; border-radius: 8px; padding: 8px 15px; color: #dcbfff; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>EAGLE TETRIS 🦅📱</h1>
    <button id="start-btn">START (10 $TALON) 🦅</button>
    <div id="game-layout">
        <div id="game-container"><canvas id="tetris" width="240" height="400"></canvas></div>
        <div class="stats">
            <div>Score:<br><span id="score">0</span></div><br>
            <div>Record:<br><span id="high-score">0</span></div><br>
            <div>Lines:<br><span id="lines">0</span></div>
        </div>
    </div>
    <div class="controls">
        <div id="btn-rotate" class="touch-btn">↻</div>
        <div id="btn-left" class="touch-btn">←</div>
        <div id="btn-down" class="touch-btn">↓</div>
        <div id="btn-right" class="touch-btn">→</div>
        <div style="grid-column: 1 / span 3; margin-top: 15px; display: flex; justify-content: center;">
            <a href="https://warpcast.com/eagle-pi" target="_blank" id="tips-btn">🟣 Tip on Farcaster</a>
        </div>
    </div>

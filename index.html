<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Tetris - $TALONS</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #FFD700;
            font-family: sans-serif;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            /* Le fond d'écran dynamique */
            background-image: url('public/skins/pngtree-golden-circuit-board-texture-background-image_901198.jpg');
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        #game-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4); /* Assombrit un peu le fond pour voir le jeu */
        }

        .tetris-border {
            width: 200px; height: 350px;
            border: 3px solid #FFD700;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px #FFD700;
        }

        /* Barre de Boutique en bas */
        #shop-bar {
            height: 110px;
            background: rgba(10, 10, 10, 0.95);
            border-top: 2px solid #FFD700;
            display: flex; align-items: center;
            justify-content: space-around;
            padding: 10px;
        }

        .skin-thumb {
            width: 65px; height: 65px;
            border: 2px solid #555;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
        }

        .active { border-color: #FFD700; box-shadow: 0 0 10px #FFD700; }
        .label { font-size: 10px; text-align: center; margin-top: 4px; color: #fff; }
    </style>
</head>
<body>

    <div id="game-area">
        <h2 style="margin-top:0;">EAGLE TETRIS 🦅</h2>
        <div class="tetris-border">
            <p style="text-align:center; padding-top:100px; color:#555;">[ Zone de Jeu ]</p>
        </div>
    </div>

    <div id="shop-bar">
        <div onclick="changeSkin('public/skins/pngtree-golden-circuit-board-texture-background-image_901198.jpg', this)">
            <div class="skin-thumb active" style="background-image: url('public/skins/pngtree-golden-circuit-board-texture-background-image_901198.jpg');"></div>
            <div class="label">GOLD</div>
        </div>
        
        <div onclick="changeSkin('public/skins/blue-sky-universe-background.jpg', this)">
            <div class="skin-thumb" style="background-image: url('public/skins/blue-sky-universe-background.jpg');"></div>
            <div class="label">NEBULA</div>
        </div>
    </div>

    <script>
        function changeSkin(url, el) {
            document.body.style.backgroundImage = "url('" + url + "')";
            document.querySelectorAll('.skin-thumb').forEach(t => t.classList.remove('active'));
            el.querySelector('.skin-thumb').classList.add('active');
        }
    </script>
</body>
</html>

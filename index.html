<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Tetris - $TALONS Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #FFD700;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* Le fond d'écran dynamique */
            background-image: url('public/skins/gold.webp');
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        #game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Simulation de la grille de Tetris */
        #tetris-grid {
            width: 240px;
            height: 400px;
            border: 4px solid #FFD700;
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* La Boutique en bas */
        #shop-bar {
            height: 120px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #FFD700;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            overflow-x: auto;
        }

        .skin-item {
            min-width: 80px;
            height: 80px;
            border: 2px solid #444;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        .skin-item.active { border-color: #FFD700; box-shadow: 0 0 10px #FFD700; }
        
        .label { font-size: 10px; text-align: center; margin-top: 5px; color: #fff; }
    </style>
</head>
<body>

    <div id="game-container">
        <h2 style="position:absolute; top:10px;">EAGLE TETRIS 🦅</h2>
        <div id="tetris-grid">
            </div>
    </div>

    <div id="shop-bar">
        <div onclick="changeSkin('gold.webp', this)">
            <div class="skin-item active" style="background-image: url('public/skins/gold.webp');"></div>
            <div class="label">GOLD</div>
        </div>
        <div onclick="changeSkin('nebula.jpg', this)">
            <div class="skin-item" style="background-image: url('public/skins/nebula.jpg');"></div>
            <div class="label">NEBULA</div>
        </div>
    </div>

    <script>
        function changeSkin(fileName, element) {
            // Change le fond d'écran du body
            document.body.style.backgroundImage = "url('public/skins/" + fileName + "')";
            
            // Met à jour l'apparence des boutons de la boutique
            document.querySelectorAll('.skin-item').forEach(item => item.classList.remove('active'));
            element.querySelector('.skin-item').classList.add('active');
        }
    </script>
</body>
</html>
